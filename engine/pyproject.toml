[project]
name = "parable"
version = "0.1.0"
description = "Parable: pay for an AI trading bot only if it survives"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anthropic>=0.40",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0",
  "itsdangerous>=2.2",
  "mcp>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
